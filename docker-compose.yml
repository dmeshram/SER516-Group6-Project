services:
  metrics-service:
    build: .
    ports:
      - "${METRICS_PORT:-8080}:8080"
    volumes:
      - "${INPUT_DIR:-./input}:/input"
    environment:
      - "INPUT_PATH=/input"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:8080/metrics/fanout?path=$INPUT_PATH/Simple-Java-Calculator/src\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - "${GRAFANA_PROVISIONING_DIR:-./grafana/provisioning}:/etc/grafana/provisioning"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - metrics-service# PostgreSQL for Grafana fan-out metrics (snapshot + time series)

  postgres:
    image: postgres:16-alpine
    container_name: postgres-metrics
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
      POSTGRES_DB: metrics
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-fanout.sql:/docker-entrypoint-initdb.d/01-init-fanout.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d metrics"]
      interval: 5s
      timeout: 5s
      retries: 5
